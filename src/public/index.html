<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Virtual Journaling</title>
</head>

<body class="principal-bg">
    <main>
        <h4>My Journal</h4>

        <section class="page-navigation">
            <button id="back-to-cover" class="hidden">⬅️ Back to Cover</button>
        </section>

        <section class="container-journal">
            <div id="journal-cover" class="round-right-side">
                <div id="inside-pages"></div>
                <div id="journal-cover-content">
                    <h3 class="cover-text">My Handbook</h3>
                </div>
            </div>

            <div id="journal-pages" class="hidden">
                <div class="page">
                    <div class="page-content" contenteditable="true"></div>
                </div>
            </div>

        </section>

    </main>

    <link rel="stylesheet" href="/src/assets/styles.css">
    <script type="module" src="/dist/index.js"></script>
</body>

</html>
