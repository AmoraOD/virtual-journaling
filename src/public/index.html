<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Virtual Journaling</title>
</head>

<body class="principal-bg">
    <main>
        <h4>My Journal</h4>

        <section class="page-navigation">
            <button id="back-to-cover" class="hidden">⬅️ Back to Cover</button>

            <div class="pages-nav-inner">
                <button id="prev-page" class="btn">⏪</button>
                <span id="indicator">1</span>
                <button id="next-page" class="btn">⏩</button>
                <button id="add-page" class="btn">➕ New Page</button>
            </div>
        </section>

        <div class="journal-wrapper">
            <section class="container-journal">
                <div id="journal-cover" class="round-right-side">
                    <div id="journal-cover-content">
                        <h3 class="cover-text">My Handbook</h3>
                    </div>
                </div>

                <div id="journal-pages" class="round-right-side">
                    <div id="page-container"></div>
                </div>

            </section>

            <section class="config-journal">
                <button id="change-color" class="btn">🎨</button>
                <div id="color-options" class="color-options hidden"></div>
            </section>
        </div>
    </main>

    <link rel="stylesheet" href="/src/assets/styles.css">
    <script type="module" src="/dist/index.js"></script>
</body>

</html>
